name: Deploy al VPS

on:
  workflow_dispatch:    # Solo manual desde GitHub Actions UI — deploy automático lo maneja webhook-deploy (PM2)

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy en VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT }}
          script: |
            bash /root/Rajem-Bot/scripts/auto-pull.sh
