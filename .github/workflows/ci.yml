name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar suite de tests
        run: npm test

  deploy:
    name: Deploy al VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger deploy via webhook
        run: |
          PAYLOAD='{"ref":"refs/heads/main","pusher":{"name":"github-actions[bot]"}}'
          SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')
          curl --fail --silent --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            -d "$PAYLOAD" \
            "$VPS_WEBHOOK_URL/deploy"
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          VPS_WEBHOOK_URL: ${{ secrets.VPS_WEBHOOK_URL }}
