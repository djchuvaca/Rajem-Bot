services:

  # ── Super admin — siempre arriba, independiente de cualquier tenant ───────────
  superadmin:
    build: .
    container_name: rajem-superadmin
    command: node src/superadmin/standalone.js
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=America/Mazatlan
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  # Los tenants se añaden aquí automáticamente al provisionar desde el super admin.
  # Cada servicio usa envs/{TENANT_ID}.env y comparte ./data con el super admin.
