services:

  # Super admin - siempre arriba, independiente de cualquier tenant
  superadmin:
    build: .
    container_name: rajem-superadmin
    command: node src/superadmin/standalone.js
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=America/Mazatlan
    ports:
      - "3001:3001"
    volumes:
      - ./data:/-Rajem-Bot/data
      - ./logs:/-Rajem-Bot/logs

  # Los tenants se anaden aqui automaticamente al provisionar desde el super admin.
  # Cada servicio usa envs/{TENANT_ID}.env y comparte ./data con el super admin.
  # Auto-deploy activo: cada push a main actualiza el VPS automaticamente.
