services:
  carnitas-bot:
    build: .
    container_name: carnitas-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=America/Mazatlan
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.wwebjs_auth:/app/.wwebjs_auth
      - ./.wwebjs_cache:/app/.wwebjs_cache
