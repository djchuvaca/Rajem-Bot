services:

  # Super admin - siempre arriba, independiente de cualquier tenant
  superadmin:
    build: .
    container_name: rajem-superadmin
    command: node src/superadmin/standalone.js
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=America/Mazatlan
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/Rajem-Bot/data
      - ./logs:/Rajem-Bot/logs
      - ./src/superadmin:/Rajem-Bot/src/superadmin

  # Los tenants van en docker-compose.override.yml (gitignoreado).
  # Docker Compose fusiona ambos archivos automaticamente.
  # El override se genera con scripts/provisionar-tenant.sh.
